# Render Blueprint for Dance Lab online. Setup steps are in docs/online.md.
services:
  - type: web
    name: dance-lab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: DANCE_LAB_PASSWORD
        sync: false # Render asks for this once; it never goes in the repo
